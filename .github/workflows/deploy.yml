name: Test and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall app evaluation
      - name: Deploy to Hugging Face Space
        if: ${{ secrets.HF_TOKEN != '' && secrets.HF_SPACE != '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          pip install -U huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi, upload_folder
          token=os.environ["HF_TOKEN"]
          repo=os.environ["HF_SPACE"]
          api=HfApi(token=token)
          api.create_repo(repo_id=repo, repo_type="space", space_sdk="docker", exist_ok=True)
          upload_folder(repo_id=repo, repo_type="space", folder_path=".", ignore_patterns=[".git/*","data/*","chroma_db/*","storage/*","evaluation/results.csv"], commit_message="Deploy latest version", token=token)
          PY
